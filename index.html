<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Master Mobile - Anagrafica & Presenze</title>
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="data:application/json,{
    \"name\": \"Master Mobile Anagrafica\",
    \"short_name\": \"MasterMobile\",
    \"start_url\": \".\",
    \"display\": \"standalone\",
    \"background_color\": \"#f8fafc\",
    \"theme_color\": \"#1e293b\"
  }">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Dexie.js (IndexedDB) -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
  <!-- jsPDF & AutoTable -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.28/dist/jspdf.plugin.autotable.min.js"></script>
  <!-- SheetJS per esportazione Excel (.xlsx) su smartphone -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    /* Ottimizzazioni per smartphone e gesture touch */
    * { -webkit-tap-highlight-color: transparent; }
    body {
      overscroll-behavior-y: none;
      padding-bottom: calc(5rem + env(safe-area-inset-bottom));
      padding-top: env(safe-area-inset-top);
    }
    .safe-bottom {
      padding-bottom: calc(0.5rem + env(safe-area-inset-bottom));
    }
    ::-webkit-scrollbar { display: none; }
    .nav-btn.active {
      color: #2563eb;
    }
    .nav-btn.active svg {
      stroke: #2563eb;
      transform: scale(1.1);
      transition: transform 0.15s ease;
    }
    .touch-press:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased select-none">

  <!-- TOP BAR SMARTPHONE -->
  <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-30 shadow-md flex justify-between items-center">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-sm font-bold text-xs">
        <i data-lucide="smartphone" class="w-4 h-4"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm tracking-tight flex items-center gap-1.5" id="app-topbar-title">
          Master Mobile <span class="text-[9px] bg-blue-500/20 text-blue-400 border border-blue-500/30 px-1.5 py-0.2 rounded font-mono">v2.5</span>
        </h1>
        <p class="text-[10px] text-slate-400" id="app-topbar-sub">Sincronizzato con archivio PC</p>
      </div>
    </div>

    <!-- AZIONI RAPIDE HEADER -->
    <div class="flex items-center gap-2">
      <button onclick="renderView('sync')" title="Sincronizza / Importa da PC" class="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-blue-400 rounded-xl transition border border-slate-700">
        <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
      </button>
      <button onclick="openModalPersona()" title="Nuovo Nominativo" class="p-2 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white rounded-xl shadow transition">
        <i data-lucide="user-plus" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- CONTENITORE PRINCIPALE VISTE SMARTPHONE -->
  <main class="flex-1 p-3.5 max-w-lg mx-auto w-full" id="mobile-workspace">
    <!-- Contenuto dinamico iniettato via JS -->
  </main>

  <!-- BOTTOM NAVIGATION BAR SMARTPHONE -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 z-40 max-w-lg mx-auto safe-bottom shadow-lg">
    <div class="flex justify-around items-center h-14 px-1">
      <button onclick="renderView('home')" id="tab-home" class="nav-btn flex-1 flex flex-col items-center justify-center text-slate-500 text-[10px] font-semibold transition">
        <i data-lucide="home" class="w-5 h-5 mb-0.5"></i>
        <span>Home</span>
      </button>

      <button onclick="renderView('persone')" id="tab-persone" class="nav-btn flex-1 flex flex-col items-center justify-center text-slate-500 text-[10px] font-semibold transition">
        <i data-lucide="users" class="w-5 h-5 mb-0.5"></i>
        <span>Persone</span>
      </button>

      <button onclick="renderView('gruppi')" id="tab-gruppi" class="nav-btn flex-1 flex flex-col items-center justify-center text-slate-500 text-[10px] font-semibold transition">
        <i data-lucide="folder-users" class="w-5 h-5 mb-0.5"></i>
        <span>Gruppi</span>
      </button>

      <button onclick="renderView('eventi')" id="tab-eventi" class="nav-btn flex-1 flex flex-col items-center justify-center text-slate-500 text-[10px] font-semibold transition">
        <i data-lucide="calendar-check" class="w-5 h-5 mb-0.5"></i>
        <span>Presenze</span>
      </button>

      <button onclick="renderView('sync')" id="tab-sync" class="nav-btn flex-1 flex flex-col items-center justify-center text-slate-500 text-[10px] font-semibold transition">
        <i data-lucide="hard-drive-download" class="w-5 h-5 mb-0.5"></i>
        <span>Da PC</span>
      </button>
    </div>
  </nav>

  <!-- MODALS & TOAST CONTAINERS -->
  <div id="modal-container"></div>
  <div id="toast-container" class="fixed top-4 left-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm mx-auto"></div>

  <script>
    // --- DATABASE SCHEMA IDENTICO ALL'APPLICATIVO DESKTOP ---
    const db = new Dexie('MobileAnagraficaDB');
    db.version(1).stores({
      persone: '++id, cognome, nome, data_nascita, luogo_nascita, codice_fiscale, telefono, email, data_inserimento',
      gruppi: '++id, nome, descrizione, colore',
      persone_gruppi: '++id, persona_id, gruppo_id, [gruppo_id+persona_id]',
      liste: '++id, nome, data_evento, descrizione, data_creazione',
      persone_liste: '++id, persona_id, lista_id, presente, [lista_id+persona_id]'
    });

    // STATO APPLICAZIONE MOBILE
    let currentView = 'home';
    let currentParam = null;
    let searchQueryPersone = '';
    let filterGruppoPersone = '';
    let sortPersone = 'alpha';

    // AVVIO
    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      await seedDemoIfEmpty();
      renderView('home');
    });

    // --- UTILITIES UI & FORMATTAZIONE ---
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 text-white shadow-emerald-900/30',
        error: 'bg-rose-600 text-white shadow-rose-900/30',
        warning: 'bg-amber-500 text-white shadow-amber-900/30',
        info: 'bg-slate-900 text-white shadow-slate-900/40'
      };
      toast.className = `${colors[type] || colors.info} pointer-events-auto px-3.5 py-2.5 rounded-2xl shadow-xl text-xs font-semibold flex items-center justify-between gap-2 border border-white/10 transition transform duration-200 -translate-y-3 opacity-0`;
      toast.innerHTML = `<span class="flex-1 leading-snug">${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('-translate-y-3', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-3');
        setTimeout(() => toast.remove(), 250);
      }, 3200);
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'N.D.';
      try {
        const parts = dateStr.split('-');
        if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        const d = new Date(dateStr);
        return isNaN(d) ? dateStr : d.toLocaleDateString('it-IT');
      } catch(e) {
        return dateStr;
      }
    }

    function escapeHtml(s) {
      return (s || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function defaultAvatar() {
      return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="%23cbd5e1"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>';
    }

    function triggerHaptic() {
      if ('vibrate' in navigator) {
        try { navigator.vibrate(35); } catch(e) {}
      }
    }

    // --- GESTIONE ROUTING VISTE ---
    function renderView(view, param = null) {
      currentView = view;
      currentParam = param;
      const ws = document.getElementById('mobile-workspace');

      // Aggiorna icone tab bar
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeTab = document.getElementById(`tab-${view}`);
      if (activeTab) activeTab.classList.add('active');

      switch(view) {
        case 'home': renderHomeView(ws); break;
        case 'persone': renderPersoneView(ws); break;
        case 'scheda-persona': renderSchedaPersonaView(ws, param); break;
        case 'gruppi': renderGruppiView(ws); break;
        case 'dettaglio-gruppo': renderDettaglioGruppoView(ws, param); break;
        case 'eventi': renderEventiView(ws); break;
        case 'dettaglio-evento': renderDettaglioEventoView(ws, param); break;
        case 'sync': renderSyncView(ws); break;
        default: renderHomeView(ws);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      lucide.createIcons();
    }

    async function renderHomeView(container) {
      const totalPersone = await db.persone.count();
      const totalGruppi = await db.gruppi.count();
      const totalEventi = await db.liste.count();
      const lastEvento = await db.liste.orderBy('data_evento').reverse().first();

      let eventoStats = { total: 0, pres: 0 };
      if (lastEvento) {
        eventoStats.total = await db.persone_liste.where('lista_id').equals(lastEvento.id).count();
        eventoStats.pres = await db.persone_liste.where({ lista_id: lastEvento.id, presente: 1 }).count();
      }

      const recenti = await db.persone.orderBy('data_inserimento').reverse().limit(4).toArray();

      container.innerHTML = `
        <div class="space-y-3.5">
          
          <!-- BANNER DI SINCRONIZZAZIONE SMARTPHONE / PC -->
          <div class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-4 rounded-3xl shadow-sm relative overflow-hidden">
            <div class="relative z-10">
              <span class="text-[10px] uppercase font-bold tracking-wider bg-white/20 px-2 py-0.5 rounded-full">Pronto per l'Uso</span>
              <h2 class="text-base font-extrabold mt-1.5 leading-tight">Archivio Personale Mobile</h2>
              <p class="text-xs text-blue-100/90 mt-1 mb-3">
                Importa in un tocco il file esportato dal PC con tutti i nominativi, foto e gruppi completi.
              </p>
              
              <div class="flex gap-2">
                <button onclick="renderView('sync')" class="flex-1 bg-white text-blue-800 font-bold text-xs py-2 px-3 rounded-xl shadow-sm touch-press flex items-center justify-center gap-1.5">
                  <i data-lucide="file-up" class="w-3.5 h-3.5"></i> Importa File PC
                </button>
                <button onclick="exportSmartphonePackage()" class="bg-blue-600/70 hover:bg-blue-600 text-white font-bold text-xs py-2 px-3 rounded-xl touch-press flex items-center justify-center gap-1.5 border border-white/20">
                  <i data-lucide="share-2" class="w-3.5 h-3.5"></i> Esporta
                </button>
              </div>
            </div>
          </div>

          <!-- CONTATORI STATISTICI -->
          <div class="grid grid-cols-3 gap-2">
            <div onclick="renderView('persone')" class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm text-center touch-press cursor-pointer">
              <span class="text-[10px] font-bold text-blue-600 uppercase block">Persone</span>
              <p class="text-xl font-black text-slate-800 mt-0.5">${totalPersone}</p>
            </div>
            <div onclick="renderView('gruppi')" class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm text-center touch-press cursor-pointer">
              <span class="text-[10px] font-bold text-purple-600 uppercase block">Gruppi</span>
              <p class="text-xl font-black text-slate-800 mt-0.5">${totalGruppi}</p>
            </div>
            <div onclick="renderView('eventi')" class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm text-center touch-press cursor-pointer">
              <span class="text-[10px] font-bold text-emerald-600 uppercase block">Eventi</span>
              <p class="text-xl font-black text-slate-800 mt-0.5">${totalEventi}</p>
            </div>
          </div>

          <!-- SCHEDA ULTIMO EVENTO PROGRAMMATO -->
          ${lastEvento ? `
            <div onclick="renderView('dettaglio-evento', ${lastEvento.id})" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm touch-press cursor-pointer space-y-2">
              <div class="flex justify-between items-start">
                <span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-100 px-2 py-0.5 rounded-md flex items-center gap-1">
                  <i data-lucide="calendar" class="w-3 h-3"></i> Evento Attivo
                </span>
                <span class="text-xs font-semibold text-slate-400">${formatDate(lastEvento.data_evento)}</span>
              </div>

              <div>
                <h3 class="font-bold text-sm text-slate-900">${escapeHtml(lastEvento.nome)}</h3>
                <p class="text-xs text-slate-500 line-clamp-1">${escapeHtml(lastEvento.descrizione || 'Nessuna nota aggiuntiva')}</p>
              </div>

              <!-- BARRA PROGRESSO PRESENZE -->
              <div class="pt-1">
                <div class="flex justify-between text-[11px] font-bold text-slate-600 mb-1">
                  <span>Presenze rilevate</span>
                  <span class="text-emerald-600">${eventoStats.pres} su ${eventoStats.total}</span>
                </div>
                <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
                  <div class="h-full bg-emerald-500 rounded-full" style="width: ${eventoStats.total > 0 ? (eventoStats.pres / eventoStats.total) * 100 : 0}%"></div>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- ULTIME PERSONE INSERITE -->
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-3.5 space-y-2">
            <div class="flex justify-between items-center mb-1">
              <h3 class="font-bold text-xs text-slate-900 uppercase tracking-wide">Recenti in archivio</h3>
              <button onclick="renderView('persone')" class="text-xs text-blue-600 font-bold">Vedi tutte</button>
            </div>

            <div class="divide-y divide-slate-100">
              ${recenti.length === 0 ? '<p class="text-center py-4 text-xs text-slate-400">Nessuna persona registrata.</p>' : ''}
              ${recenti.map(p => `
                <div onclick="renderView('scheda-persona', ${p.id})" class="py-2 flex items-center justify-between touch-press cursor-pointer">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <img src="${p.foto || defaultAvatar()}" class="w-9 h-9 rounded-full object-cover border border-slate-200">
                    <div class="min-w-0">
                      <p class="font-bold text-xs text-slate-900 truncate">${escapeHtml(p.cognome)} ${escapeHtml(p.nome)}</p>
                      <p class="text-[10px] text-slate-400 truncate">${escapeHtml(p.luogo_nascita || formatDate(p.data_nascita))}</p>
                    </div>
                  </div>
                  <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- BOTTONI RAPIDI AZIONI -->
          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="openModalPersona()" class="p-3 bg-slate-900 text-white font-bold rounded-2xl text-xs flex items-center justify-center gap-1.5 shadow touch-press">
              <i data-lucide="user-plus" class="w-4 h-4"></i> + Persona
            </button>
            <button onclick="openModalNuovoEvento()" class="p-3 bg-blue-600 text-white font-bold rounded-2xl text-xs flex items-center justify-center gap-1.5 shadow touch-press">
              <i data-lucide="calendar-plus" class="w-4 h-4"></i> + Evento
            </button>
          </div>

        </div>
      `;
    }

    async function renderPersoneView(container) {
      const gruppi = await db.gruppi.toArray();

      container.innerHTML = `
        <div class="space-y-3">
          
          <!-- SEARCH & QUICK BAR -->
          <div class="space-y-2 sticky top-[52px] bg-slate-100 pt-1 pb-1 z-20">
            <div class="relative">
              <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
              <input type="text" id="mobile-search-persone" oninput="filtraPersoneMobile()" value="${escapeHtml(searchQueryPersone)}"
                placeholder="Cerca per cognome, nome, CF, tel..."
                class="w-full pl-9 pr-8 py-2 bg-white border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
              ${searchQueryPersone ? `
                <button onclick="clearSearchPersone()" class="absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600">
                  <i data-lucide="x-circle" class="w-4 h-4"></i>
                </button>
              ` : ''}
            </div>

            <!-- FILTRI GRUPPO E ORDINAMENTO COMPATTO -->
            <div class="flex gap-2 text-xs">
              <select id="mobile-filter-gruppo" onchange="filtraPersoneMobile()" class="flex-1 bg-white border border-slate-300 rounded-xl px-2.5 py-1.5 text-slate-700 font-semibold focus:outline-none truncate">
                <option value="">Tutti i Gruppi</option>
                ${gruppi.map(g => `<option value="${g.id}" ${filterGruppoPersone == g.id ? 'selected' : ''}>${escapeHtml(g.nome)}</option>`).join('')}
              </select>

              <select id="mobile-filter-sort" onchange="filtraPersoneMobile()" class="bg-white border border-slate-300 rounded-xl px-2.5 py-1.5 text-slate-700 font-semibold focus:outline-none">
                <option value="alpha" ${sortPersone === 'alpha' ? 'selected' : ''}>A-Z</option>
                <option value="recent" ${sortPersone === 'recent' ? 'selected' : ''}>Recenti</option>
              </select>
            </div>
          </div>

          <!-- CONTATORE & PULSANTE PDF / EXCEL -->
          <div class="flex justify-between items-center px-1 text-xs">
            <span id="mobile-counter-persone" class="font-bold text-slate-500">Caricamento...</span>
            <div class="flex items-center gap-2">
              <button onclick="exportPersonePDFMobile()" class="text-rose-600 font-bold flex items-center gap-1 hover:underline">
                <i data-lucide="file-text" class="w-3.5 h-3.5"></i> PDF
              </button>
              <button onclick="exportAllPeopleToExcelMobile()" class="text-emerald-600 font-bold flex items-center gap-1 hover:underline">
                <i data-lucide="sheet" class="w-3.5 h-3.5"></i> Excel
              </button>
            </div>
          </div>

          <!-- LISTA CARDS PERSONE SMARTPHONE -->
          <div id="mobile-persone-list" class="space-y-2"></div>
        </div>
      `;
      filtraPersoneMobile();
    }

    function clearSearchPersone() {
      const input = document.getElementById('mobile-search-persone');
      if (input) input.value = '';
      filtraPersoneMobile();
    }

    async function filtraPersoneMobile() {
      searchQueryPersone = document.getElementById('mobile-search-persone')?.value.toLowerCase().trim() || '';
      filterGruppoPersone = document.getElementById('mobile-filter-gruppo')?.value || '';
      sortPersone = document.getElementById('mobile-filter-sort')?.value || 'alpha';

      const listContainer = document.getElementById('mobile-persone-list');
      const counterEl = document.getElementById('mobile-counter-persone');
      if (!listContainer) return;

      let persone = await db.persone.toArray();
      const allAssoc = await db.persone_gruppi.toArray();
      const allGruppi = await db.gruppi.toArray();
      const mapGruppi = {};
      allGruppi.forEach(g => mapGruppi[g.id] = g.nome);

      const userGroupsMap = {};
      allAssoc.forEach(a => {
        if (!userGroupsMap[a.persona_id]) userGroupsMap[a.persona_id] = [];
        if (mapGruppi[a.gruppo_id]) userGroupsMap[a.persona_id].push(mapGruppi[a.gruppo_id]);
      });

      if (filterGruppoPersone) {
        const targetGId = parseInt(filterGruppoPersone);
        const validIds = new Set(allAssoc.filter(a => a.gruppo_id === targetGId).map(a => a.persona_id));
        persone = persone.filter(p => validIds.has(p.id));
      }

      if (searchQueryPersone) {
        persone = persone.filter(p => {
          const str = `${p.cognome} ${p.nome} ${p.codice_fiscale || ''} ${p.telefono || ''} ${p.luogo_nascita || ''}`.toLowerCase();
          return str.includes(searchQueryPersone);
        });
      }

      if (sortPersone === 'alpha') {
        persone.sort((a, b) => a.cognome.localeCompare(b.cognome) || a.nome.localeCompare(b.nome));
      } else {
        persone.sort((a, b) => new Date(b.data_inserimento || 0) - new Date(a.data_inserimento || 0));
      }

      counterEl.innerText = `${persone.length} persone`;

      if (persone.length === 0) {
        listContainer.innerHTML = `
          <div class="bg-white p-8 rounded-2xl border text-center text-slate-400">
            <i data-lucide="user-x" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
            <p class="font-bold text-xs">Nessun soggetto trovato</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      listContainer.innerHTML = persone.map(p => {
        const gruppiUser = userGroupsMap[p.id] || [];
        return `
          <div onclick="renderView('scheda-persona', ${p.id})" class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3 touch-press cursor-pointer">
            <div class="flex items-center gap-3 min-w-0 flex-1">
              <img src="${p.foto || defaultAvatar()}" class="w-12 h-12 rounded-2xl object-cover border border-slate-100 shadow-sm flex-shrink-0">
              <div class="min-w-0 flex-1">
                <h4 class="font-bold text-xs text-slate-900 truncate">${escapeHtml(p.cognome)} ${escapeHtml(p.nome)}</h4>
                <p class="text-[11px] text-slate-500 font-mono truncate">${escapeHtml(p.codice_fiscale || formatDate(p.data_nascita))}</p>
                
                ${gruppiUser.length > 0 ? `
                  <div class="flex flex-wrap gap-1 mt-1">
                    ${gruppiUser.slice(0, 2).map(g => `<span class="bg-purple-50 text-purple-700 font-bold text-[9px] px-1.5 py-0.2 rounded">${escapeHtml(g)}</span>`).join('')}

      await db.persone_gruppi.add({ persona_id: id, gruppo_id: gruppoId });

      renderView('dettaglio-gruppo', gruppoId);

    let currentPresFilter = 'tutti';
    function setPresenceTab(filter) {
      window.currentPresFilter = filter;
      ['tutti', 'presenti', 'assenti'].forEach(f => {
        const el = document.getElementById(`tab-pres-${f}`);
        if (!el) return;
        if (f === filter) {
          el.className = 'flex-1 py-1.5 rounded-xl bg-blue-600 text-white font-bold text-center';
        } else {
          el.className = 'flex-1 py-1.5 rounded-xl bg-slate-200 text-slate-700 font-bold text-center';
        }
      });
      filtraPresenzeMobile();
    }

    function filtraPresenzeMobile() {
      const q = document.getElementById('mobile-search-presenze')?.value.toLowerCase().trim() || '';
      document.querySelectorAll('.presenza-mobile-row').forEach(row => {
        const name = row.getAttribute('data-name') || '';
        const isPres = row.getAttribute('data-presente') === '1';

        let show = name.includes(q);
        if (show) {
          if (window.currentPresFilter === 'presenti') show = isPres;
          if (window.currentPresFilter === 'assenti') show = !isPres;
        }
        row.style.display = show ? 'flex' : 'none';
      });
    }

    async function aggiungiGruppoAdEventoMobile(eventoId) {

      const assocGruppo = await db.persone_gruppi.where('gruppo_id').equals(gId).toArray();
      const existing = await db.persone_liste.where('lista_id').equals(eventoId).toArray();

        .filter(a => !existingSet.has(a.persona_id))
        .map(a => ({ persona_id: a.persona_id, lista_id: eventoId, presente: 0 }));

      if (daAggiungere.length > 0) {
        await db.persone_liste.bulkAdd(daAggiungere);

    async function gestisciImportFilePC(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(ev) {
        try {
          const data = JSON.parse(ev.target.result);
          if (!data.persone) {
            showToast('File non riconosciuto o non valido.', 'error');
            return;
          }

          // Sovrascrive/aggiorna il database locale con i dati completi dal PC
          await db.persone.clear();
          await db.gruppi.clear();
          await db.persone_gruppi.clear();
          await db.liste.clear();
          await db.persone_liste.clear();

          await db.persone.bulkAdd(data.persone);
          if (data.gruppi) await db.gruppi.bulkAdd(data.gruppi);
          if (data.persone_gruppi) await db.persone_gruppi.bulkAdd(data.persone_gruppi);
          if (data.liste) await db.liste.bulkAdd(data.liste);
          if (data.persone_liste) await db.persone_liste.bulkAdd(data.persone_liste);

          showToast(`Sincronizzazione completata! Caricati ${data.persone.length} soggetti.`, 'success');
          renderView('home');
        } catch(err) {
          console.error(err);
          showToast('Errore durante la lettura del file JSON.', 'error');
        }
      };
      reader.readAsText(file);
    }

    async function exportSmartphonePackage() {
      const data = {
        versione: "2.5",
        data_esportazione: new Date().toISOString(),
        dispositivo: "Smartphone",
        persone: await db.persone.toArray(),
        gruppi: await db.gruppi.toArray(),
        persone_gruppi: await db.persone_gruppi.toArray(),
        liste: await db.liste.toArray(),
        persone_liste: await db.persone_liste.toArray()
      };

      const jsonStr = JSON.stringify(data);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Archivio_Mobile_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      showToast('File scaricato! Invialo al PC per sincronizzare le presenze.', 'success');
    }

    async function gestisciImportExcelMobile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(ev) {
        try {
          const data = new Uint8Array(ev.target.result);
          const wb = XLSX.read(data, { type: 'array', cellDates: true });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });

          if (rows.length === 0) return showToast('File Excel vuoto.', 'warning');

          let count = 0;
          for (const row of rows) {
            const keys = Object.keys(row);
            const cogKey = keys.find(k => /^cognome$/i.test(k.trim()) || /cognome/i.test(k.trim()));
            const nomKey = keys.find(k => /^nome$/i.test(k.trim()) || (/nome/i.test(k.trim()) && !/cognome/i.test(k.trim())));
            const dataKey = keys.find(k => /data/i.test(k.trim()) || /nascita/i.test(k.trim()));
            const luogoKey = keys.find(k => /luogo/i.test(k.trim()) || /città/i.test(k.trim()));

            const cognome = String(row[cogKey] || '').trim();
            const nome = String(row[nomKey] || '').trim();
            let data_nascita = row[dataKey] || '';
            const luogo_nascita = String(row[luogoKey] || '').trim();

            if (!cognome || !nome) continue;

            if (data_nascita instanceof Date) {
              data_nascita = data_nascita.toISOString().split('T')[0];
            }

            const dup = await db.persone.where({ cognome, nome }).first();
            if (!dup) {
              await db.persone.add({
                cognome, nome, data_nascita, luogo_nascita, foto: '', data_inserimento: new Date().toISOString()
              });
              count++;
            }
          }
          showToast(`Importati ${count} nuovi soggetti da Excel!`, 'success');
          renderView('persone');
        } catch(err) {
          showToast('Errore lettura Excel.', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function comprimiFotoSmartphone(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX = 500;
          let w = img.width, h = img.height;
          if (w > MAX) { h *= MAX / w; w = MAX; }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressed = canvas.toDataURL('image/jpeg', 0.75);
          document.getElementById('mobile-foto-preview').src = compressed;
          document.getElementById('mobile-foto-base64').value = compressed;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function salvaPersonaSoggettaMobile(e, id) {
      e.preventDefault();
      const cognome = document.getElementById('mob-cognome').value.trim();
      const nome = document.getElementById('mob-nome').value.trim();
      const data_nascita = document.getElementById('mob-data_nascita').value;
      const luogo_nascita = document.getElementById('mob-luogo_nascita').value.trim();
      const codice_fiscale = document.getElementById('mob-codice_fiscale').value.trim().toUpperCase();
      const telefono = document.getElementById('mob-telefono').value.trim();
      const email = document.getElementById('mob-email').value.trim();
      const indirizzo = document.getElementById('mob-indirizzo').value.trim();
      const note = document.getElementById('mob-note').value.trim();
      const foto = document.getElementById('mobile-foto-base64').value;

      const gruppiSel = Array.from(document.querySelectorAll('input[name="mob-gruppi-select"]:checked')).map(c => parseInt(c.value));

      const payload = {
        cognome, nome, data_nascita, luogo_nascita, codice_fiscale,
        telefono, email, indirizzo, note, foto,
        data_inserimento: id ? (await db.persone.get(id)).data_inserimento : new Date().toISOString()
      };

      let personaId = id;
      if (id) {
        await db.persone.update(id, payload);
        await db.persone_gruppi.where('persona_id').equals(id).delete();
      } else {
        personaId = await db.persone.add(payload);
      }

      const gAssoc = gruppiSel.map(gruppo_id => ({ persona_id: personaId, gruppo_id }));
      await db.persone_gruppi.bulkAdd(gAssoc);

      showToast(`Scheda salvata con successo!`, 'success');
      closeModal();
      if (currentView === 'scheda-persona') {
        renderView('scheda-persona', personaId);
      } else {
        renderView('persone');
      }
    }

    // --- GENERATORE DI FOTO RASTER PER PDF MOBILE ---
    async function getRasterImageForPdf(src) {
      if (!src) return null;
      if (src.startsWith('data:image/jpeg') || src.startsWith('data:image/png')) return src;
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = 80; canvas.height = 80;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#f1f5f9';
            ctx.fillRect(0, 0, 80, 80);
            ctx.drawImage(img, 0, 0, 80, 80);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          } catch(e) { resolve(null); }
        };
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function exportPersonePDFMobile() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape');
      let persone = await db.persone.toArray();
      persone.sort((a, b) => a.cognome.localeCompare(b.cognome));

      if (persone.length === 0) return showToast('Nessun nominativo da esportare.', 'warning');
      showToast('Generazione PDF con foto in corso...', 'info');

      const conFoto = await Promise.all(persone.map(async p => ({ ...p, pdfPhoto: await getRasterImageForPdf(p.foto || defaultAvatar()) })));

      doc.setFontSize(14);
      doc.text("Archivio Anagrafica - Master Mobile", 14, 15);
      doc.setFontSize(8);
      doc.text(`Totale: ${persone.length} | Data: ${new Date().toLocaleDateString('it-IT')}`, 14, 20);

      doc.autoTable({
        head: [['N.', 'Foto', 'Cognome e Nome', 'Data Nascita', 'Codice Fiscale', 'Telefono']],
        body: conFoto.map((p, i) => [i + 1, '', `${p.cognome} ${p.nome}`, formatDate(p.data_nascita), p.codice_fiscale || '-', p.telefono || '-']),
        startY: 24,
        styles: { fontSize: 8, cellPadding: 2, minCellHeight: 12, valign: 'middle' },
        columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 14, halign: 'center' } },
        headStyles: { fillColor: [30, 41, 59] },
        didDrawCell: function(data) {
          if (data.section === 'body' && data.column.index === 1) {
            const item = conFoto[data.row.index];
            if (item && item.pdfPhoto) {
              const sz = 9;
              const posX = data.cell.x + (data.cell.width - sz) / 2;
              const posY = data.cell.y + (data.cell.height - sz) / 2;
              try { doc.addImage(item.pdfPhoto, 'JPEG', posX, posY, sz, sz); } catch(e) {}
            }
          }
        }
      });
      doc.save(`Anagrafica_Mobile_${new Date().toISOString().split('T')[0]}.pdf`);
      showToast('PDF Anagrafica scaricato!', 'success');
    }

    async function exportPresenzePDFMobile(eventoId, nomeEvento, dataEvento) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const assoc = await db.persone_liste.where('lista_id').equals(eventoId).toArray();
      const mapAssoc = {};
      assoc.forEach(a => mapAssoc[a.persona_id] = a);

      const pIds = assoc.map(a => a.persona_id);
      let persone = await db.persone.where('id').anyOf(pIds).toArray();
      persone.sort((a, b) => a.cognome.localeCompare(b.cognome));

      if (persone.length === 0) return showToast('Nessun partecipante da esportare.', 'warning');
      showToast('Generazione foglio presenze PDF...', 'info');

      const conFoto = await Promise.all(persone.map(async p => ({ ...p, pdfPhoto: await getRasterImageForPdf(p.foto || defaultAvatar()) })));

      const totali = persone.length;
      const presenti = assoc.filter(a => a.presente === 1).length;

      doc.setFontSize(14);
      doc.text(`Presenze: ${nomeEvento}`, 14, 15);
      doc.setFontSize(8);
      doc.text(`Data: ${formatDate(dataEvento)} | Totale: ${totali} | Presenti: ${presenti} | Assenti: ${totali - presenti}`, 14, 20);

      doc.autoTable({
        head: [['N.', 'Foto', 'Cognome e Nome', 'Codice Fiscale', 'Stato Presenza']],
        body: conFoto.map((p, i) => [
          i + 1, '', `${p.cognome} ${p.nome}`, p.codice_fiscale || '-', mapAssoc[p.id]?.presente === 1 ? 'PRESENTE' : 'ASSENTE'
        ]),
        startY: 24,
        styles: { fontSize: 8.5, cellPadding: 2, minCellHeight: 12, valign: 'middle' },
        columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 14, halign: 'center' } },
        headStyles: { fillColor: [37, 99, 235] },
        didDrawCell: function(data) {
          if (data.section === 'body' && data.column.index === 1) {
            const item = conFoto[data.row.index];
            if (item && item.pdfPhoto) {
              const sz = 9;
              const posX = data.cell.x + (data.cell.width - sz) / 2;
              const posY = data.cell.y + (data.cell.height - sz) / 2;
              try { doc.addImage(item.pdfPhoto, 'JPEG', posX, posY, sz, sz); } catch(e) {}
            }
          }
        },
        didParseCell: function(data) {
          if (data.column.index === 4) {
            if (data.cell.raw === 'PRESENTE') {
              data.cell.styles.textColor = [16, 185, 129];
              data.cell.styles.fontStyle = 'bold';
            } else {
              data.cell.styles.textColor = [239, 68, 68];
            }
          }
        }
      });
      doc.save(`Presenze_${nomeEvento.replace(/\s+/g, '_')}.pdf`);
      showToast('Foglio Presenze PDF scaricato!', 'success');
    }

    async function exportAllPeopleToExcelMobile() {
      const persone = await db.persone.toArray();
      if (persone.length === 0) return showToast('Nessuna persona da esportare.', 'warning');
      persone.sort((a, b) => a.cognome.localeCompare(b.cognome));

      const rows = persone.map((p, i) => ({
        'N.': i + 1,
        'Cognome': p.cognome,
        'Nome': p.nome,
        'Data di Nascita': formatDate(p.data_nascita),
        'Luogo di Nascita': p.luogo_nascita || '',
        'Codice Fiscale': p.codice_fiscale || '',
        'Telefono': p.telefono || '',
        'Email': p.email || ''
      }));

      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Anagrafica");
      XLSX.writeFile(wb, `Anagrafica_${new Date().toISOString().split('T')[0]}.xlsx`);
      showToast('File Excel generato!', 'success');
    }
